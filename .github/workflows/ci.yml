name: CI
on:
  push:
    branches: ['main', 'vibe/**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check server/serveur.js
      - run: node tests/m0.js
      - run: node tests/m1-membres.js
      - run: node tests/m1b-visites.js
